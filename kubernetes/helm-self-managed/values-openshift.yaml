# ============================================================================
# TYK SELF-MANAGED - RED HAT OPENSHIFT OVERLAY (tyk-charts 5.4.0+)
# ============================================================================
# Layer this file on top of values.yaml:
#
#   helm install tyk tyk-helm/tyk-stack --version 5.4.0 \
#     -f values.yaml -f values-openshift.yaml
#
# It turns every pod-level, container-level and init-container securityContext
# block off with `enabled: false`, so the rendered manifests carry no UID/GID
# and OpenShift's Security Context Constraint (restricted-v2) assigns them from
# the namespace's allocated range.
#
# `enabled: false` is the only supported opt-out. Setting a block to `{}` does
# not work (Helm deep-merges the chart defaults back in), and the `runAsUser:
# null` / `fsGroup: null` approach used before 5.4.0 leaves the gateway's
# setup-directories init container pinned to runAsUser 65532, which
# restricted-v2 rejects.
#
# The same settings appear as commented "Required for deploying on RedHat
# OpenShift" blocks beside each component in values.yaml.
# ============================================================================

tyk-gateway:
  gateway:
    securityContext:
      enabled: false
    containerSecurityContext:
      enabled: false
    # Disable the init container's own block too: left enabled, it takes
    # runAsUser from containerSecurityContext, then securityContext, then
    # 65532 - which restricted-v2 rejects once the other two are disabled.
    initContainers:
      setupDirectories:
        securityContext:
          enabled: false
    # OpenShift exposes services through Routes. LoadBalancer services are
    # often not permitted (the Developer Sandbox quota allows none).
    service:
      type: ClusterIP

tyk-dashboard:
  dashboard:
    securityContext:
      enabled: false
    containerSecurityContext:
      enabled: false
    # Only renders for un-prefixed dashboard tags <= 5.0.2 (5.0.2, not v5.0.2).
    initContainers:
      initAnalyticsConf:
        securityContext:
          enabled: false
    service:
      type: ClusterIP

tyk-pump:
  pump:
    securityContext:
      enabled: false
    containerSecurityContext:
      enabled: false

# Developer Portal blocks sit at the chart root, not under a `devPortal` key.
tyk-dev-portal:
  securityContext:
    enabled: false
  containerSecurityContext:
    enabled: false
  bootstrapJob:
    securityContext:
      enabled: false
    containerSecurityContext:
      enabled: false
  service:
    type: ClusterIP

tyk-bootstrap:
  bootstrap:
    securityContext:
      enabled: false
    containerSecurityContext:
      enabled: false

# tyk-operator (v1.5.0 in tyk-charts 5.4.0) needs no entry here: it pins no
# UID, so restricted-v2 assigns one. Do NOT set tyk-operator.securityContext
# to {enabled: false} - this operator chart has no `enabled` flag, so the key
# is rendered verbatim and strict validation (kubectl, Argo CD, Flux) rejects
# the Deployment with `unknown field ...securityContext.enabled`.
# Installing the operator (and cert-manager) needs cluster-admin; where you
# lack it, also set global.components.operator=false.

# `helm test` pod. Its default pins runAsUser 1000, which restricted-v2 rejects.
tests:
  securityContext:
    enabled: false
  containerSecurityContext:
    enabled: false
