# ============================================================================
# KUBERNETES GATEWAY API - EXAMPLE ROUTE
# ============================================================================
# An httpbin Service and an HTTPRoute that sends api.example.com/orders/* to it
# through Tyk. The operator creates one Tyk OAS API in the Dashboard for the
# route. Apply after gateway-api/class-and-gateway.yaml:
#
#   kubectl apply -f gateway-api/example-route.yaml
#   curl -H "Host: api.example.com" http://<gateway-address>:8080/orders/get
#
# The route has no authentication until example-auth.yaml is applied.
# ============================================================================
---
apiVersion: v1
kind: Namespace
metadata:
  name: gateway-api-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpbin
  namespace: gateway-api-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: httpbin
  template:
    metadata:
      labels:
        app: httpbin
    spec:
      containers:
        - name: httpbin
          image: mccutchen/go-httpbin:v2.15.0
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: httpbin
  namespace: gateway-api-demo
spec:
  selector:
    app: httpbin
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: orders
  namespace: gateway-api-demo
spec:
  parentRefs:
    - name: tyk
      namespace: tyk
  hostnames:
    - api.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /orders
      # Strip /orders, so httpbin receives /get rather than /orders/get.
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: httpbin
          port: 80
