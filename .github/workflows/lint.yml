name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  yaml-lint:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint YAML files
        run: |
          yamllint -d "{extends: relaxed, rules: {line-length: disable, truthy: disable}}" \
            docker/*/docker-compose*.yml \
            docker/*/*/docker-compose*.yml \
            docker/observability/confs \
            kubernetes/*/*.yaml \
            kubernetes/*/gateway-api \
            utils/*/docker-compose.yml \
            observability/collector \
            observability/rules

  topology-matrix:
    name: Topology Matrix Paths
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check every matrix path exists
        run: python3 tools/check_topology_matrix.py

  shellcheck:
    name: Shell Script Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: '.'
          severity: error

  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Lint Markdown files
        uses: DavidAnson/markdownlint-cli2-action@v25
        with:
          globs: '**/*.md'
          config: '.github/.markdownlint.json'

  markdown-links:
    name: Markdown Link Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check Markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config .github/lychee.toml --no-progress './**/*.md'
          fail: true
