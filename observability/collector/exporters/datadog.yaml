# Datadog, alongside the local stack. The Tyk Grafana dashboards do not apply there;
# the metrics, traces and logs arrive under their OpenTelemetry names.
#
#   DD_API_KEY  Datadog API key
#   DD_SITE     datadoghq.com (default), datadoghq.eu, us3.datadoghq.com, ...

exporters:
  datadog/export:
    api:
      key: ${env:DD_API_KEY}
      site: ${env:DD_SITE:-datadoghq.com}

connectors:
  # APM stats (hits, errors, latency per service) from the traces.
  datadog/connector:

service:
  pipelines:
    metrics/export:
      receivers: [otlp, datadog/connector]
      processors: [memory_limiter, batch]
      exporters: [datadog/export]
    traces/export:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [datadog/connector, datadog/export]
    logs/export:
      receivers: [otlp, file_log/tyk]
      processors: [memory_limiter, batch]
      exporters: [datadog/export]
