# Tempo 3 for the Tyk Gateway's traces. Monolithic mode (the default -target=all, no Kafka),
# local storage. PROD: object storage (S3, GCS, Azure) and a retention that suits you.

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal

overrides:
  defaults:
    compaction:
      # PROD: longer, e.g. 336h (14 days, Tempo's default)
      block_retention: 72h

usage_report:
  reporting_enabled: false
