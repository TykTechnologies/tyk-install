# Prometheus for Tyk. Tyk components push OTLP to the collector, which exposes them
# on :8889; Prometheus scrapes that, and evaluates the Tyk alert rules.

global:
  # PROD: 30s-60s, in step with the components' export interval
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  # Every Tyk component's metrics, relayed by the collector. honor_labels keeps the
  # components' own job / instance (service.name / service.instance.id).
  - job_name: tyk
    honor_labels: true
    static_configs:
      - targets: [otel-collector:8889]

  # The collector's own health: received, refused and exported data points, queue sizes.
  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:8888]

  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
