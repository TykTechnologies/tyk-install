services:
  tyk-ai-studio:
    restart: unless-stopped
    image: ${AI_STUDIO_IMAGE:-tykio/tyk-ai-studio}:${AI_STUDIO_VERSION:-v2.2.2}
    container_name: tyk-ai-studio
    ports:
      - "4000:8080" # Admin UI + REST API (HTTPS)
      - "9090:9090" # Embedded AI Gateway
    env_file:
      - ./confs/studio.env
    environment:
      TYK_AI_LICENSE: ${TYK_AI_LICENSE:-} # Enterprise images only
    volumes:
      - ./confs/studio.env:/opt/tyk-ai-studio/.env
      - ./studio-data:/opt/tyk-ai-studio/data
      - ./studio-certs:/opt/tyk-ai-studio/certs
      - ./plugins:/opt/plugins
    networks:
      - tyk-ai-studio
    depends_on:
      postgres:
        condition: service_healthy

  microgateway:
    restart: unless-stopped
    image: ${MICROGATEWAY_IMAGE:-tykio/tyk-microgateway}:${MICROGATEWAY_VERSION:-v2.2.2}
    container_name: tyk-ai-microgateway
    ports:
      - "9091:8080" # Edge Gateway
    env_file:
      - ./confs/microgateway.env
    environment:
      TYK_AI_LICENSE: ${TYK_AI_LICENSE:-} # Enterprise images only
    volumes:
      - ./confs/microgateway.env:/opt/tyk-microgateway/.env
      - ./confs/analytics-pulse.yaml:/opt/tyk-microgateway/analytics-pulse.yaml
      - ./mgw-data:/opt/tyk-microgateway/data
      - ./mgw-plugins:/var/lib/microgateway
      - ./plugins:/opt/plugins
    networks:
      - tyk-ai-studio
    depends_on:
      tyk-ai-studio:
        condition: service_started

  postgres:
    restart: unless-stopped
    image: postgres:16-alpine
    container_name: tyk-ai-postgres
    environment:
      POSTGRES_USER: tykuser
      POSTGRES_PASSWORD: tykSecurePass123
      POSTGRES_DB: tyk_ai_studio
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tykuser -d tyk_ai_studio"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - tyk-ai-studio

networks:
  tyk-ai-studio:
    driver: bridge
    name: tyk-ai-studio

volumes:
  pgdata:
    name: tyk-ai-studio-postgres-data
