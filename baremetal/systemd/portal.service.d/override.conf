# Reference copy of the drop-in that install.sh writes to
# /etc/systemd/system/portal.service.d/override.conf
#
# Configuration lives in /etc/default/portal, which the packaged unit already
# reads. This file is for hardening only.

[Service]
# PROD: Restart on failure rather than leaving the service down.
Restart=on-failure
RestartSec=5

# PROD: Raise the file descriptor limit; the default is commonly too low.
LimitNOFILE=65536

# PROD: Hardening. Verify against your own environment before enabling -
# ProtectHome and a read-only filesystem will break plugin paths or
# certificates stored outside /opt/portal.
# NoNewPrivileges=true
# PrivateTmp=true
# ProtectSystem=full
# ProtectHome=true
