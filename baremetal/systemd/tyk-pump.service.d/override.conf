# Reference copy of the drop-in that install.sh writes to
# /etc/systemd/system/tyk-pump.service.d/override.conf
#
# The leading '-' on EnvironmentFile makes a missing file non-fatal, so the unit
# still starts from its packaged defaults if the drop-in has not been installed.

[Service]
EnvironmentFile=-/etc/tyk/pump.env

# PROD: Restart on failure rather than leaving a gateway down.
Restart=on-failure
RestartSec=5

# PROD: Raise the file descriptor limit. A busy gateway holds many upstream
# connections, and the default is commonly too low.
LimitNOFILE=65536

# PROD: Hardening. Verify against your own environment before enabling -
# ProtectHome and a read-only filesystem will break custom plugin paths or
# certificates stored outside /opt/tyk-pump.
# NoNewPrivileges=true
# PrivateTmp=true
# ProtectSystem=full
# ProtectHome=true
